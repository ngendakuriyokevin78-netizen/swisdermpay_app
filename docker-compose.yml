version: '3.9'

# ============================================================
# Cash Tel — Docker Compose
# Services : Django (web), PostgreSQL (db), Redis, Celery
# ============================================================

services:

  # ── Base de données PostgreSQL ──────────────────────────
  db:
    image: postgres:16-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data/
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-cashtel}
      POSTGRES_USER: ${POSTGRES_USER:-cashtel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cashtel_password}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cashtel}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Cache Redis ──────────────────────────────────────────
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Application Django ───────────────────────────────────
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py create_initial_data &&
             python manage.py collectstatic --noinput &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - media_volume:/app/media
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

  # ── Worker Celery (SMS, notifications async) ─────────────
  celery:
    build: .
    command: celery -A cashtel.celery_app worker --loglevel=info -Q default
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env

volumes:
  postgres_data:
  media_volume:
